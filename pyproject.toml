[project]
name = "gold-ai"
version = "0.2.0"
description = "GOLD-AI 黄金智能交易研究与策略进化系统（Phase 1: Gold Intelligence Database）"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy>=2.0.30",
    "alembic>=1.13.1",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "psycopg[binary]>=3.1.19",
    # Windows 没有系统 tz 数据库，zoneinfo 需要 tzdata；市场时区解析必须确定
    "tzdata>=2024.1",
    # 采集器 HTTP 并发（06_Cline开发规则 第 2 条：asyncio + aiohttp）
    "aiohttp>=3.9.5",
    # 结构化配置解析：config/logging.yaml（日志系统，02 §4）
    "PyYAML>=6.0.1",
    # ------------------------------------------------------------------
    # Phase 2（Author Lab）依赖 —— 团队已批准（2026-09 裁决）
    # 说明：观点抽取本身只用 pydantic + 标准库；以下依赖用于
    #   传播关系语义相似度（TF-IDF/余弦）、作者技能与样本量修正、
    #   置信度校准与标注一致性统计（Cohen's Kappa / Spearman / ECE）。
    # 严禁引入 Deep Learning / RL（.clinerules 第 4 条）：
    #   不引入 torch / transformers / sentence-transformers / PaddleOCR。
    # ------------------------------------------------------------------
    "numpy>=1.26",
    "pandas>=2.2",
    "scikit-learn>=1.4",
    # LLM 接入走可注入接口（默认 Mock 实现）；真实调用只在配置密钥后启用
    "httpx>=0.27",
    # 中文分词（相似度 / 关键词）；纯 Python，无需下载模型
    "jieba>=0.42.1",
    # ------------------------------------------------------------------
    # Phase 2 真实语料采集（团队批准，2026-09-14）：
    #   RSS 源（金十/汇通/华尔街见闻/Investing.com）解析。
    #   仅做 feed 解析，不抓取 HTML 正文；每个源必须 robots 允许后才启用。
    # ------------------------------------------------------------------
    "feedparser>=6.0.11",
    # ------------------------------------------------------------------
    # Phase 3.3 数据源接入（团队批准，2026-09-21）：
    #   akshare：上海黄金交易所（SGE）历史日线行情（src/collectors/akshare_gold.py）；
    #   dbnomics：世界银行/IMF 等宏观序列聚合（src/collectors/dbnomics_macro.py）。
    #   均为公开数据源；代码延迟 import，测试 100% Mock 不触发真实调用。
    # ------------------------------------------------------------------
    "akshare>=1.14.0",
    "dbnomics>=1.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    # 格式化/静态检查版本**必须钉死**（团队裁决 2026-09-14，TD-33）：
    # 随版本浮动会让 ruff 行为在 CI 上漂移（0.16.x 起 docstring 归一化/折行策略变化，
    # 会让历史文件突然 "would be reformatted"）。升级 ruff 必须是**独立提交**，
    # 并在同一次提交里跑一次 `ruff format .` + 全量门禁（pytest/ruff check/mypy）。
    "ruff==0.16.7",
    "mypy>=1.10.0",
    # ------------------------------------------------------------------
    # xlsx 读取（团队 2026-09-13 批准）
    # 说明：`scripts/compare_model_annotations.py` 自身用标准库
    #   ``zipfile`` + ``xml.etree`` 解析 xlsx（零依赖、离线可复现，有单元测试锁定），
    #   因此**运行时不需要** openpyxl；这里显式声明它是为了后续
    #   「人工裁决结果与三模型共识合并 / 用 pandas.read_excel 复核」这类工具链。
    # ------------------------------------------------------------------
    "openpyxl>=3.1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["config*", "database*", "src*"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
# 采集器是异步实现（asyncio + aiohttp），测试统一使用 auto 模式：
# async def 测试函数无需逐个加 @pytest.mark.asyncio。
asyncio_mode = "auto"
markers = [
    "unit: 单函数/单类测试",
    "integration: 数据库/外部依赖集成测试",
    "regression: Bug 回归测试",
    "data_quality: 数据质量测试",
    "leakage: 时间因果（未来数据泄漏）测试",
]

[tool.ruff]
line-length = 100
target-version = "py312"
# 注意：不要使用 ``exclude``（会覆盖 ruff 对 .venv/site-packages 的默认排除），
# 需要额外排除时使用 ``extend-exclude``。

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
# 与 06_Cline开发规则 第 20 条一致：对核心包（配置 + 数据库 + 业务源码）做类型检查。
# tests/ 不纳入 mypy：测试大量使用 **kwargs 工厂与 type: ignore 注入，
# 类型噪声高于收益；测试正确性由 pytest + ruff 保证（已在 README 与 CI 中说明）。
files = ["config", "database", "src", "scripts"]
exclude = ["database/migrations/versions/"]
show_error_codes = true
warn_unused_configs = true
warn_redundant_casts = true
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true
ignore_missing_imports = true
