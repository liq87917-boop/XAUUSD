# =============================================================================
# GOLD-AI logging configuration (02_系统详细设计 §4: config/logging.yaml)
#
# Loaded by config/logging.py via logging.config.dictConfig(). The file must be
# UTF-8 (no BOM) — enforced by tests/unit/test_config_encoding.py.
#
# Design notes:
# - every log line carries UTC time and the process/thread name for triage;
# - collectors write their own per-run summaries into DBs (collector_runs), so
#   file logging stays intentionally lean (90~180 day retention per docs/03 §16).
# =============================================================================
version: 1
disable_existing_loggers: false

formatters:
  standard:
    format: "%(asctime)sZ | %(levelname)-7s | %(name)s | %(message)s"
    datefmt: "%Y-%m-%dT%H:%M:%S"

handlers:
  console:
    class: logging.StreamHandler
    level: INFO
    formatter: standard
    stream: ext://sys.stdout
  file:
    class: logging.handlers.RotatingFileHandler
    level: INFO
    formatter: standard
    filename: logs/gold_ai.log
    maxBytes: 10485760
    backupCount: 10
    encoding: utf-8
    delay: true

loggers:
  gold_ai:
    level: INFO
    handlers: [console, file]
    propagate: false
  sqlalchemy.engine:
    level: WARNING
    handlers: [console]
    propagate: false

root:
  level: WARNING
  handlers: [console]
