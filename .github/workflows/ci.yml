name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: lint + type check + tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      # GOLD-040：控制面（review binding / ledger integrity / backlog）必须能**独立重算**
      # GOLD-025~027 等历史完成 commit 的绑定，因此 checkout 必须提供完整可达历史。
      # actions/checkout 默认 `fetch-depth: 1`（浅克隆）会让这些重算假失败为
      # `COMPLETION_COMMIT_NOT_FOUND`；这里显式取全历史，且绝不放宽该 fail-closed 判定。
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install project with dev tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Ruff lint
        run: python -m ruff check .

      - name: Mypy static type check (config/ database/ src/)
        run: python -m mypy

      - name: Pytest (unit + integration + data_quality + leakage)
        run: python -m pytest -q

      - name: Migration smoke test (SQLite upgrade + downgrade)
        run: |
          python -m alembic -x db_url="sqlite+pysqlite:///./ci_migration_check.db" upgrade head
          python -m alembic -x db_url="sqlite+pysqlite:///./ci_migration_check.db" downgrade base

  postgres:
    name: PostgreSQL native schema + seeds
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: gold_ai
          POSTGRES_PASSWORD: gold_ai
          POSTGRES_DB: gold_ai
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gold_ai -d gold_ai"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://gold_ai:gold_ai@localhost:5432/gold_ai
    steps:
      # GOLD-040：同上，PostgreSQL schema+seeds job 也在完整历史上运行，
      # 保证两个 job 对同一 Git 历史给出同一结论。
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install project with dev tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Alembic upgrade head (PostgreSQL)
        run: python -m alembic upgrade head

      - name: Assert PostgreSQL native types + seed idempotency
        run: python scripts/check_pg_schema.py

      - name: Alembic downgrade base (rollback must work)
        run: python -m alembic downgrade base
