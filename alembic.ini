# =============================================================================
# Alembic configuration
# All schema changes MUST go through Alembic (docs/03, section 19: DB migration).
# Never hand-edit a release database, never delete or rewrite a released revision.
#
# NOTE: keep this file pure ASCII on purpose. Python configparser (used by both
# Alembic and logging.fileConfig) reads ini files with the platform default
# encoding, which is GBK on a zh-CN Windows host; non-ASCII comments would make
# `alembic upgrade head` fail with UnicodeDecodeError.
# =============================================================================

[alembic]
script_location = database/migrations
prepend_sys_path = .
file_template = %%(rev)s_%%(slug)s
timezone = UTC
version_path_separator = os
path_separator = os

# The database URL is deliberately NOT hardcoded here (secrets / DSNs must not be
# committed). database/migrations/env.py resolves it in this order:
#   1) CLI override: alembic -x db_url=sqlite+pysqlite:///./tmp.db upgrade head
#   2) this file sqlalchemy.url (left empty on purpose)
#   3) environment variable DATABASE_URL (see config/settings.py)
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
# IMPORTANT: single '%' on purpose (real bug fixed here).
# logging.config.fileConfig() reads 'format'/'datefmt' with raw=True, so
# configparser interpolation is NOT applied to these two values; writing '%%'
# would pass a literal "%%(levelname)..." to logging.Formatter and every log
# line would print the format string itself instead of the message
# (alembic/sqlalchemy migration logs would lose all content).
# The [alembic] section above still needs '%%' because Alembic reads it through
# configparser *with* interpolation.
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
